server:
  port: 9005

spring:
  application:
    name: PAYMENT-SERVICE

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/foodexpress_payment}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost